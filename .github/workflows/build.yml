name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Project Structure and Move Resources
        run: |
          mkdir -p app/src/main/java/com/itv/mediagroup
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi

          if [ -f "logo_itv.png" ]; then cp logo_itv.png app/src/main/res/drawable/; fi
          if [ -f "logo_ritm.png" ]; then cp logo_ritm.png app/src/main/res/drawable/; fi
          if [ -f "ic_launcher.png" ]; then cp ic_launcher.png app/src/main/res/mipmap-hdpi/; fi

          # 1. settings.gradle.kts
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "ITVMEDIAGROUP"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts

          # 2. build.gradle.kts (root)
          echo 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }' > build.gradle.kts

          # 3. gradle.properties
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.itv.mediagroup"
              compileSdk = 34
              defaultConfig { applicationId = "com.itv.mediagroup"; minSdk = 21; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("androidx.media3:media3-session:1.2.1")
          }
          EOF

          # 5. themes.xml
          echo '<resources><style name="Theme.ITVMEDIAGROUP" parent="Theme.MaterialComponents.DayNight.NoActionBar" /></resources>' > app/src/main/res/values/themes.xml

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application 
                  android:allowBackup="true" 
                  android:label="ITVMEDIAGROUP" 
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.ITVMEDIAGROUP"
                  android:usesCleartextTraffic="true">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <activity android:name=".PlayerActivity" android:configChanges="orientation|screenSize|layoutDirection|screenLayout" android:exported="false" />
                  
                  <service android:name=".MediaPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 7. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:weightSum="2"
              android:background="#121212">

              <ImageButton
                  android:id="@+id/btnTv"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_margin="20dp"
                  android:scaleType="fitCenter"
                  android:background="#E50914"
                  android:src="@drawable/logo_itv"
                  android:contentDescription="ITV Media Group" />

              <ImageButton
                  android:id="@+id/btnRadio"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_margin="20dp"
                  android:scaleType="fitCenter"
                  android:background="#FFFFFF"
                  android:src="@drawable/logo_ritm"
                  android:contentDescription="Радіо РИТМ" />

          </LinearLayout>
          EOF

          # 8. activity_player.xml (Більш прозорі кнопки)
          cat << 'EOF' > app/src/main/res/layout/activity_player.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ImageView
                  android:id="@+id/radioLogo"
                  android:layout_width="300dp"
                  android:layout_height="300dp"
                  android:layout_gravity="center"
                  android:src="@drawable/logo_ritm"
                  android:alpha="0.4"
                  android:visibility="gone"
                  android:contentDescription="Radio Logo" />

              <Button
                  android:id="@+id/btnBack"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:layout_gravity="top|start"
                  android:layout_marginStart="24dp"
                  android:layout_marginTop="24dp"
                  android:text="◀"
                  android:textSize="20sp"
                  android:textColor="#FFFFFF"
                  android:background="#1A000000" />

              <Button
                  android:id="@+id/btnFullScreen"
                  android:layout_width="80dp"
                  android:layout_height="56dp"
                  android:layout_gravity="top|end"
                  android:layout_marginEnd="24dp"
                  android:layout_marginTop="24dp"
                  android:text="⛶"
                  android:textSize="18sp"
                  android:textColor="#FFFFFF"
                  android:background="#1A000000" />

          </FrameLayout>
          EOF

          # 9. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/itv/mediagroup/MainActivity.kt
          package com.itv.mediagroup

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.ImageButton
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlin.system.exitProcess

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  findViewById<ImageButton>(R.id.btnTv).setOnClickListener {
                      startPlayer("https://cdn10.live-tv.cloud/itvrv/abr-lq/itvrv/480p/chunks.m3u8", true)
                  }

                  findViewById<ImageButton>(R.id.btnRadio).setOnClickListener {
                      startPlayer("http://31.131.18.66:8000/ritm-mp3-192", false)
                  }
              }

              private fun startPlayer(url: String, isVideo: Boolean) {
                  val intent = Intent(this, PlayerActivity::class.java).apply {
                      putExtra("URL", url)
                      putExtra("IS_VIDEO", isVideo)
                  }
                  startActivity(intent)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  exitProcess(0)
              }
          }
          EOF

          # 10. PlayerActivity.kt (Зупинка радіо та сервісу при поверненні кнопкою назад)
          cat << 'EOF' > app/src/main/java/com/itv/mediagroup/PlayerActivity.kt
          package com.itv.mediagroup

          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.ImageView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var audioManager: AudioManager
              private var startX = 0f
              private var startY = 0f
              private var baseVolume = 0
              private var baseBrightness = 0.5f
              private var screenWidth = 0
              private var isLandscapeFullScreen = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_player)

                  val isVideo = intent.getBooleanExtra("IS_VIDEO", true)
                  playerView = findViewById(R.id.playerView)
                  val radioLogo = findViewById<ImageView>(R.id.radioLogo)
                  val btnBack = findViewById<Button>(R.id.btnBack)
                  val btnFullScreen = findViewById<Button>(R.id.btnFullScreen)

                  if (isVideo) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      radioLogo.visibility = View.GONE
                  } else {
                      radioLogo.visibility = View.VISIBLE
                      btnFullScreen.visibility = View.GONE
                      val serviceIntent = Intent(this, MediaPlaybackService::class.java)
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                  }

                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  screenWidth = resources.displayMetrics.widthPixels

                  btnBack.setOnClickListener {
                      // Повна зупинка плеєра та фонового сервісу при поверненні в меню
                      player?.stop()
                      player?.release()
                      player = null
                      if (!isVideo) {
                          stopService(Intent(this, MediaPlaybackService::class.java))
                      }
                      finish()
                  }

                  btnFullScreen.setOnClickListener {
                      isLandscapeFullScreen = !isLandscapeFullScreen
                      requestedOrientation = if (isLandscapeFullScreen) {
                          ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                      } else {
                          ActivityInfo.SCREEN_ORIENTATION_SENSOR
                      }
                  }

                  val url = intent.getStringExtra("URL") ?: return
                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(7000, 15000, 2500, 5000)
                      .build()

                  player = ExoPlayer.Builder(this)
                      .setLoadControl(loadControl)
                      .build().apply {
                          playerView.player = this
                          setMediaItem(MediaItem.fromUri(Uri.parse(url)))
                          prepare()
                          playWhenReady = true
                      }

                  playerView.setOnTouchListener { _, event ->
                      handleTouch(event)
                      true
                  }
              }

              private fun handleTouch(event: MotionEvent) {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          startX = event.x
                          startY = event.y
                          baseVolume = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                          baseBrightness = window.attributes.screenBrightness.let { if (it < 0) 0.5f else it }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val deltaY = startY - event.y
                          val maxVolume = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          if (startX < screenWidth / 2) {
                              val deltaBrightness = deltaY / playerView.height
                              var newBrightness = baseBrightness + deltaBrightness
                              if (newBrightness > 1.0f) newBrightness = 1.0f
                              if (newBrightness < 0.01f) newBrightness = 0.01f
                              val lp = window.attributes
                              lp.screenBrightness = newBrightness
                              window.attributes = lp
                          } else {
                              val deltaVolume = ((deltaY / playerView.height) * maxVolume).toInt()
                              var newVolume = baseVolume + deltaVolume
                              if (newVolume > maxVolume) newVolume = maxVolume
                              if (newVolume < 0) newVolume = 0
                              audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, newVolume, 0)
                          }
                      }
                  }
              }

              override fun onStop() {
                  super.onStop()
                  if (intent.getBooleanExtra("IS_VIDEO", true)) {
                      player?.stop()
                      player?.release()
                      player = null
                      finish()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.stop()
                  player?.release()
                  player = null
              }
          }
          EOF

          # 11. MediaPlaybackService.kt
          cat << 'EOF' > app/src/main/java/com/itv/mediagroup/MediaPlaybackService.kt
          package com.itv.mediagroup

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class MediaPlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = androidx.media3.exoplayer.ExoPlayer.Builder(this).build()
                  mediaSession = MediaSession.Builder(this, player).build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channelId = "itv_radio_channel"
                      val channelName = "Radio Background Playback"
                      val channel = NotificationChannel(channelId, channelName, NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)

                      val notification: Notification = NotificationCompat.Builder(this, channelId)
                          .setContentTitle("Радіо РИТМ")
                          .setContentText("Відтворення у фоновому режимі")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .build()

                      startForeground(1, notification)
                  }
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = mediaSession

              override fun onDestroy() {
                  mediaSession?.player?.stop()
                  mediaSession?.player?.release()
                  mediaSession?.release()
                  mediaSession = null
                  super.onDestroy()
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --warning-mode all

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ITVMEDIAGROUP-app
          path: app/build/outputs/apk/debug/app-debug.apk
