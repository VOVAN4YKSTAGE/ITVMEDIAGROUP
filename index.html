<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITVMEDIAGROUP</title>
    
    <!-- Налаштування для PWA та iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ITV Media Group">
    <link rel="apple-touch-icon" href="ic_launcher.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        .btn-media {
            flex: 1;
            margin: 20px;
            border: none;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }
        .btn-media:active {
            transform: scale(0.98);
        }
        .btn-tv { background-color: #E50914; }
        
        /* Автоматичне адаптивне масштабування логотипу телебачення для ПК та мобільних */
        .btn-media img {
            width: 100%;
            height: 100%;
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        /* Екран плеєра */
        #player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px; height: 50px;
            font-size: 24px;
            z-index: 101;
            cursor: pointer;
        }
    </style>
    <!-- Підключаємо HLS.js для відтворення .m3u8 потоків -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Головне меню (лише Телебачення) -->
    <div class="menu-container" id="main-menu">
        <button class="btn-media btn-tv" onclick="openPlayer('https://cdn10.live-tv.cloud/itvrv/abr-lq/itvrv/480p/chunks.m3u8')">
            <img src="logo_itv.png" alt="ITV Media Group">
        </button>
    </div>

    <!-- Екран плеєра -->
    <div id="player-screen">
        <button class="back-btn" onclick="closePlayer()">◀</button>
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const playerScreen = document.getElementById('player-screen');
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function openPlayer(url) {
            mainMenu.style.display = 'none';
            playerScreen.style.display = 'block';

            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3 });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => console.log(e)); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => { video.play().catch(e => console.log(e)); });
            }
        }

        function closePlayer() {
            video.pause();
            video.src = "";
            if (hls) {
                hls.destroy();
                hls = null;
            }
            playerScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        // Реєстрація Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
