<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITVMEDIAGROUP</title>
    
    <!-- Налаштування для PWA та iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ITV Media Group">
    <link rel="apple-touch-icon" href="ic_launcher.png">
    <link rel="manifest" href="manifest.json">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        .btn-media {
            flex: 1;
            margin: 20px;
            border: none;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #E50914;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }
        .btn-media:active {
            transform: scale(0.98);
        }
        
        /* Автоматичне адаптивне масштабування логотипу для ПК та мобільних */
        .btn-media img {
            width: 100%;
            height: 100%;
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        /* Екран плеєра */
        #player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px; height: 45px;
            font-size: 20px;
            z-index: 101;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- Фікси для пропорцій на iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="ic_launcher.png">
    <!-- Фікс кольору фону для iOS PWA -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <!-- Підключаємо HLS.js для відтворення потоків .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Головне меню -->
    <div class="menu-container" id="main-menu">
        <button class="btn-media" onclick="openPlayer('https://cdn10.live-tv.cloud/itvrv/abr-lq/itvrv/480p/chunks.m3u8')">
            <img src="logo_itv.png" alt="ITV Media Group">
        </button>
    </div>

    <!-- Екран плеєра -->
    <div id="player-screen">
        <button class="back-btn" onclick="closePlayer()">✕</button>
        <video id="videoPlayer" controls autoplay playsinline webkit-playsinline></video>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const playerScreen = document.getElementById('player-screen');
        const video = document.getElementById('videoPlayer');
        let hls = null;

        function openPlayer(url) {
            mainMenu.style.display = 'none';
            playerScreen.style.display = 'block';

            // На iOS вбудований Safari відтворює потоки нативно
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(err => console.log("Помилка автоплею:", err));
                });
            } 
            // Для решти пристроїв використовуємо Hls.js
            else if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3 });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.log("Помилка HLS:", err));
                });
            }
        }

        function closePlayer() {
            video.pause();
            video.src = "";
            if (hls) {
                hls.destroy();
                hls = null;
            }
            playerScreen.style.display = 'none';
            mainMenu.style.display = 'flex';
        }

        // Реєстрація сервіс-воркера для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
